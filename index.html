<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEEDCORE</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #08080c;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        font-family: monospace;
      }
      #hpbar {
        width: 220px;
        height: 14px;
        border: 2px solid #46f0c8;
        background: rgba(8, 8, 12, 0.7);
      }
      #hpfill {
        height: 100%;
        width: 100%;
        background: #46f0c8;
        transition: width 80ms linear;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="hpbar"><div id="hpfill"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
