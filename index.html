<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEEDCORE</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #08080c;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        font-family: monospace;
      }
      #hpbar {
        width: 220px;
        height: 14px;
        border: 2px solid #4a423a;
        background: rgba(10, 9, 8, 0.8);
        box-shadow: 0 0 0 1px #14100c, inset 0 2px 4px rgba(0, 0, 0, 0.6);
      }
      #hpfill {
        height: 100%;
        width: 100%;
        background: linear-gradient(#8a2424, #5e1616);
        transition: width 80ms linear;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="hpbar"><div id="hpfill"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
